<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ryosus — Projects</title>
<meta name="description" content="An index of every live GitHub Pages project under github.com/ryosus.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3Er%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="identity">
      <a class="identity-link" href="https://github.com/ryosus" target="_blank" rel="noopener noreferrer">
        <span class="avatar" aria-hidden="true">r</span>
        <span class="identity-text">
          <span class="identity-name">ryosus</span>
          <span class="identity-sub">Projects &amp; experiments</span>
        </span>
      </a>
    </div>

    <div class="search">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="6.8" cy="6.8" r="4.6"></circle>
        <path d="M10.4 10.4 14 14"></path>
      </svg>
      <input id="filter" type="search" autocomplete="off" spellcheck="false" disabled
             placeholder="Filter projects…" aria-label="Filter projects by name, description, language, or topic">
      <kbd class="search-hint" aria-hidden="true">/</kbd>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <p class="status" id="status" role="status" aria-live="polite">Loading projects…</p>
  <div class="grid" id="grid" aria-busy="true" aria-label="Projects"></div>
</main>

<footer class="wrap site-footer">
  <p>
    Live project index for <a href="https://github.com/ryosus" target="_blank" rel="noopener noreferrer">github.com/ryosus</a>,
    generated from the GitHub REST API in your browser. Only public repositories with GitHub Pages enabled are listed.
  </p>
</footer>

<noscript>
  <div class="wrap">
    <p class="panel panel-error">
      This index loads project data from the GitHub API, which needs JavaScript.
      Browse everything at <a href="https://github.com/ryosus?tab=repositories" target="_blank" rel="noopener noreferrer">github.com/ryosus</a> instead.
    </p>
  </div>
</noscript>

<!-- Card shell. Every text node is filled via textContent so repository data can never inject markup. -->
<template id="card-template">
  <article class="card">
    <div class="card-head">
      <h2 class="card-title"><a class="card-link" data-link href="#"></a></h2>
      <a class="icon-link" data-source href="#" target="_blank" rel="noopener noreferrer">
        <span class="sr-only" data-source-label>Source code on GitHub</span>
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
        </svg>
      </a>
    </div>
    <p class="card-desc" data-desc></p>
    <div class="card-meta" data-meta></div>
  </article>
</template>

<!-- Placeholder shown while the GitHub API request is in flight. -->
<template id="skeleton-template">
  <article class="card card-skeleton" aria-hidden="true">
    <div class="sk sk-title"></div>
    <div class="sk sk-line"></div>
    <div class="sk sk-line sk-short"></div>
    <div class="sk-meta"><span class="sk sk-badge"></span><span class="sk sk-badge"></span><span class="sk sk-badge"></span></div>
  </article>
</template>

<script src="app.js" type="module"></script>
</body>
</html>
